name: release
on:
  push:
    tags: ['v*']
  workflow_dispatch:     # dry run: builds and packages, uploads the files as artifacts, publishes nothing
env:
  C3C_VERSION: v0.8.6              # the snapshot in data/corpus.dat and the tests belong to exactly this compiler
  MCP_REF: a7d0dd196640340ee9c1cc7d9dceb2a0128af5e7   # konimarti/mcp.c3l, pinned
permissions:
  contents: read         # the build jobs only read; `publish` below asks for write
jobs:
  build:
    strategy:
      fail-fast: true
      matrix:
        include:
          - { os: ubuntu-22.04,    target: linux-x64,    ext: tar.gz }   # the oldest glibc we still support: a newer runner makes a binary that does not start on Ubuntu 22.04 or Debian 12
          - { os: macos-latest,   target: macos-arm64,  ext: tar.gz }
          - { os: windows-latest, target: windows-x64,  ext: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Versions agree (project.json, server, c3c pin, tag)
        shell: bash
        run: sh test/version_check.sh "${GITHUB_REF_NAME}"
        if: startsWith(github.ref, 'refs/tags/v')
      - name: SDK (mcp.c3l, pinned)
        shell: bash
        run: |
          git clone https://github.com/konimarti/mcp.c3l deps/mcp.c3l
          git -C deps/mcp.c3l checkout "$MCP_REF"
      - name: c3c ${{ env.C3C_VERSION }}
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)   asset=c3-linux.tar.gz ;;
            macOS)   asset=c3-macos.zip ;;
            Windows) asset=c3-windows.zip ;;
          esac
          curl -fsSL -o "$asset" "https://github.com/c3lang/c3c/releases/download/$C3C_VERSION/$asset"
          mkdir c3c-install
          case "$asset" in
            *.tar.gz) tar xzf "$asset" -C c3c-install ;;
            *.zip)    7z x -y "$asset" -oc3c-install > /dev/null ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then echo "$(cygpath -w "$PWD/c3c-install/c3")" >> "$GITHUB_PATH"; else echo "$PWD/c3c-install/c3" >> "$GITHUB_PATH"; fi
          echo "C3_DIR=$PWD/c3c-install/c3" >> "$GITHUB_ENV"
      - name: C compiler for the vendored tree-sitter sources (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # c3c compiles project.json "c-sources" with `cc`, which windows-latest does not have; clang is
          # preinstalled, but refuses the -fPIE that c3c always adds, so it is called through a small wrapper
          clang --version
          echo "REAL_CC=clang" >> "$GITHUB_ENV"
          echo "C3C_CC=$(cygpath -w "$GITHUB_WORKSPACE/.github/scripts/cc-no-pie.cmd")" >> "$GITHUB_ENV"
      - name: c3c version
        shell: bash
        run: c3c --version
      - name: Build (-O3)
        shell: bash
        run: c3c build c3-guide-mcp -O3
      - name: Windows exe has no debug runtime (VCRUNTIME140D, ucrtbased exist only with Visual Studio)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          if grep -qaiE 'vcruntime[0-9]*d\.dll|ucrtbased\.dll' build/c3-guide-mcp.exe; then echo "the exe imports a debug runtime"; exit 1; fi
          echo "no debug runtime imported"
      - name: Linux binary needs glibc 2.35 or older
        if: runner.os == 'Linux'
        shell: bash
        run: |
          need=$(objdump -T build/c3-guide-mcp | grep -o 'GLIBC_[0-9.]*' | sed 's/GLIBC_//' | sort -V | tail -1)
          echo "the binary needs glibc $need"
          [ "$(printf '%s\n' "$need" 2.35 | sort -V | tail -1)" = 2.35 ] || { echo "newer than 2.35: it would not start on Ubuntu 22.04"; exit 1; }
      - name: Smoke test
        shell: bash
        run: |
          exe=build/c3-guide-mcp; [ "$RUNNER_OS" = Windows ] && exe=build/c3-guide-mcp.exe
          python3 test/smoke.py "$exe"
      - name: Package
        shell: bash
        run: |
          set -e
          name="c3-guide-mcp-${GITHUB_REF_NAME}-c3c0.8.6-${{ matrix.target }}"
          mkdir "$name"
          exe=c3-guide-mcp; [ "$RUNNER_OS" = Windows ] && exe=c3-guide-mcp.exe
          cp "build/$exe" LICENSE NOTICE README.md "$name/"
          if [ "${{ matrix.ext }}" = zip ]; then 7z a -tzip "$name.zip" "$name" > /dev/null; else tar czf "$name.tar.gz" "$name"; fi
          ls -l "$name.${{ matrix.ext }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: c3-guide-mcp-*.${{ matrix.ext }}
  publish:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum c3-guide-mcp-* > SHA256SUMS
          cat SHA256SUMS
          pre=""; case "$GITHUB_REF_NAME" in *-*) pre="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" c3-guide-mcp-* SHA256SUMS --repo "$GITHUB_REPOSITORY" $pre \
            --title "$GITHUB_REF_NAME (c3c 0.8.6)" \
            --notes "Prebuilt c3-guide-mcp for c3c 0.8.6 (Linux x64, macOS arm64, Windows x64). Unpack, point your MCP client at the binary, set C3C to your c3c if it is not on PATH (c3_check, c3_test and c3_run need it; c3_lookup and c3_search work without). Verify with SHA256SUMS."
