name: ci
on:
  push:
    branches: [main]
  pull_request:
env:
  C3C_VERSION: v0.8.5_1            # the snapshot in data/corpus.dat and the tests belong to exactly this compiler
  C3L_REF: 260a63ab7358ccf4fa29ab25be1f394324754b7c   # konimarti/c3l (a shell script), pinned
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: c3c ${{ env.C3C_VERSION }}
        shell: bash
        run: |
          set -e
          case "$RUNNER_OS" in
            Linux)   asset=c3-linux.tar.gz ;;
            macOS)   asset=c3-macos.zip ;;
            Windows) asset=c3-windows.zip ;;
          esac
          curl -fsSL -o "$asset" "https://github.com/c3lang/c3c/releases/download/$C3C_VERSION/$asset"
          mkdir c3c-install
          case "$asset" in
            *.tar.gz) tar xzf "$asset" -C c3c-install ;;
            *.zip)    7z x -y "$asset" -oc3c-install > /dev/null ;;
          esac
          if [ "$RUNNER_OS" = Windows ]; then echo "$(cygpath -w "$PWD/c3c-install/c3")" >> "$GITHUB_PATH"; else echo "$PWD/c3c-install/c3" >> "$GITHUB_PATH"; fi
          echo "C3_DIR=$PWD/c3c-install/c3" >> "$GITHUB_ENV"
      - name: C compiler for the vendored tree-sitter sources (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          # c3c compiles project.json "c-sources" with `cc`, which windows-latest does not have; clang is preinstalled
          clang --version
          echo "C3C_CC=clang" >> "$GITHUB_ENV"
      - name: c3c version
        shell: bash
        run: c3c --version
      - name: Dependencies (c3l.lock)
        shell: bash
        run: |
          mkdir -p "$HOME/bin"
          curl -fsSL -o "$HOME/bin/c3l" "https://raw.githubusercontent.com/konimarti/c3l/$C3L_REF/c3l"
          chmod +x "$HOME/bin/c3l"
          export PATH="$HOME/bin:$PATH"
          c3l sync --frozen
          c3l verify
      - name: Versions and the c3c hook
        if: runner.os == 'Linux'
        run: |
          sh test/version_check.sh
          sh test/hook_test.sh
      - name: Build (-O3)
        shell: bash
        run: c3c build c3-guide-mcp -O3
      - name: Smoke test
        shell: bash
        run: |
          exe=build/c3-guide-mcp; [ "$RUNNER_OS" = Windows ] && exe=build/c3-guide-mcp.exe
          python3 test/smoke.py "$exe"
      - name: Full test suite (Linux, macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          c3c test c3-guide-mcp
          python3 test/stdio_test.py
          python3 test/growth_test.py
      - name: Snapshot matches this c3c
        if: runner.os == 'Linux'
        run: python3 test/corpus_test.py "$C3_DIR"
      - name: Default build passes too (Linux)
        if: runner.os == 'Linux'
        run: |
          c3c build c3-guide-mcp
          python3 test/stdio_test.py
